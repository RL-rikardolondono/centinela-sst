<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Centinela SST: sistema de gestión de seguridad y salud en el trabajo para empresas en Colombia. Una aplicación de SkyNet Genesis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 200%27%3E%3Crect x=%274%27 y=%274%27 width=%27192%27 height=%27192%27 rx=%2746%27 fill=%27%231E3A4C%27/%3E%3Ccircle cx=%27100%27 cy=%27100%27 r=%2730%27 fill=%27%23E0A21A%27/%3E%3C/svg%3E">
<script>window.CENTINELA_API = "https://centinela-sst-api.onrender.com";</script>
</head>
<body>
<title>Centinela SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#E4EAE9; --ink:#15232B; --muted:#56676F; --line:#D2DBDA;
  --navy:#1E3A4C; --navy-ink:#FFFFFF; --navy-2:#2B4E63; --amber:#E0A21A; --amber-ink:#1A1405; --amber-soft:#FBF1D6;
  --ok:#2A7F50; --ok-bg:#E1F1E7; --warn:#946A00; --warn-bg:#FAEFD0; --bad:#B93A27; --bad-bg:#F8E1DC;
  --info:#1D5F8C; --info-bg:#DDEBF5; --focus:#1B6FB3; --shadow:0 12px 32px rgba(21,35,43,.16);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F181D; --surface:#162228; --surface-2:#1E2D34; --ink:#E4ECEE; --muted:#98A9B0; --line:#2A3A42;
    --navy:#1B3444; --navy-ink:#FFFFFF; --navy-2:#2A4A5E; --amber:#F0B53A; --amber-ink:#1A1405; --amber-soft:#3A3018;
    --ok:#62C48E; --ok-bg:#163020; --warn:#E9C052; --warn-bg:#352C12; --bad:#EE7B67; --bad-bg:#3B1E19;
    --info:#7DB8E4; --info-bg:#172C3C; --focus:#6FB3EA; --shadow:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F181D; --surface:#162228; --surface-2:#1E2D34; --ink:#E4ECEE; --muted:#98A9B0; --line:#2A3A42;
  --navy:#1B3444; --navy-ink:#FFFFFF; --navy-2:#2A4A5E; --amber:#F0B53A; --amber-ink:#1A1405; --amber-soft:#3A3018;
  --ok:#62C48E; --ok-bg:#163020; --warn:#E9C052; --warn-bg:#352C12; --bad:#EE7B67; --bad-bg:#3B1E19;
  --info:#7DB8E4; --info-bg:#172C3C; --focus:#6FB3EA; --shadow:0 12px 32px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:30px} h3{font-size:21px} h4{font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--info);text-underline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12.5px}
.small{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}

/* barra superior */
.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .tower{width:24px;height:28px;flex:none}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.2px}
.co{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid rgba(255,255,255,.25);min-width:0}
.co img{height:34px;width:auto;max-width:90px;background:#fff;border-radius:5px;padding:2px;object-fit:contain}
.co .nm{font-weight:600;font-size:14px;line-height:1.2}
.co .nm small{display:block;font-weight:400;opacity:.8;font-size:12px}
.sp{flex:1}
.who{font-size:13px;text-align:right;line-height:1.25}
.who small{display:block;opacity:.8}
.top .lnk{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600}
.top .lnk:hover{background:rgba(255,255,255,.2)}
nav.menu{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:15}
.menu-in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:thin}
.menu-in button{background:none;border:0;padding:12px 11px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
.menu-in button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--amber)}
.sgm{display:inline-flex;align-items:center;gap:8px;margin-top:14px;text-decoration:none;color:var(--muted);font-size:12.5px}
.sgm svg{width:24px;height:24px;flex:none}
.sgm b{font-family:var(--f-display);font-weight:700;letter-spacing:.04em;color:var(--navy)}
.sgm b.g{color:var(--amber)}
footer.pie{max-width:1240px;margin:0 auto;padding:4px 20px 28px}
.menu-in.grp{border-bottom:1px solid var(--line)}
.menu-in.sub{background:var(--surface-2);max-width:none;padding-left:max(12px,calc((100% - 1240px)/2 + 12px))}
.menu-in.sub button{padding:9px 11px;font-size:13.5px}
.menu-in button .ct{font-size:11px;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:9px;margin-left:5px}
main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:22px 70px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.lead{color:var(--muted);margin:6px 0 0;max-width:75ch}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--navy-2)}
.btn.pri{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.amb{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.dan{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.wa{background:#1F8A4C;color:#fff;border-color:#1F8A4C;text-decoration:none}
.btn.wa:hover{filter:brightness(1.08)}
.btn.gh{background:transparent;border-color:transparent;color:var(--info);padding:5px 8px}
.btn.gh:hover{background:var(--info-bg)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;flex-wrap:wrap}

/* paneles */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat b{display:block;font-family:var(--f-display);font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.alert{box-shadow:inset 4px 0 0 var(--bad)} .stat.alert b{color:var(--bad)}
.stat.warn{box-shadow:inset 4px 0 0 var(--amber)}
.stat.good{box-shadow:inset 4px 0 0 var(--ok)}
.meter{height:7px;border-radius:4px;background:var(--surface-2);margin-top:9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}

/* vigía */
.watch{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.watch header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.watch ol{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.watch li{display:grid;grid-template-columns:104px 1fr auto;gap:14px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line)}
.watch li:last-child{border-bottom:0}
.due{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.due.over{color:var(--bad)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)} .due.info{color:var(--info)}

/* tablas */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
.t th,.t td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t th{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface-2);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;position:sticky;top:0}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t tr.click{cursor:pointer} .t tr.click:hover td{background:color-mix(in srgb,var(--info-bg) 55%,transparent)}
.t tr.off td{color:var(--muted)}
.t .nm{font-weight:600}
.t .sub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1 1 240px}
.field,.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}

.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)} .p-amb{background:var(--amber-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface)}
.notice{background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);border-radius:8px;padding:10px 14px;font-size:13.5px}
.lock{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:14px}
.norma{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:10px}
.norma b{color:var(--ink);font-weight:600}

/* formularios */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog.wide{width:min(940px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,16,22,.55)}
dialog[open]{display:flex;flex-direction:column}
dialog form{display:flex;flex-direction:column;min-height:0;flex:1}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.dh h3{font-size:23px}
.dh p{margin:3px 0 0;color:var(--muted);font-size:13px}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 7px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.db{padding:16px 20px;overflow:auto;min-height:0}
.df{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.df .sp{margin-right:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label,.lbl{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.form .full{grid-column:1/-1}
.form .field{font-weight:500;color:var(--ink);font-size:14.5px;width:100%}
.form textarea.field{min-height:64px;resize:vertical}
.form fieldset{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0}
.form legend{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{flex-direction:row;align-items:center;gap:6px;font-weight:500;color:var(--ink);font-size:13.5px}
.clin{grid-column:1/-1;border:1px solid color-mix(in srgb,var(--info) 40%,var(--line));background:color-mix(in srgb,var(--info-bg) 45%,transparent);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.clin h4{grid-column:1/-1;color:var(--info);font-size:15px}
.err{grid-column:1/-1;color:var(--bad);font-size:13.5px;font-weight:600}
.hint{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:9px 12px;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
.asist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:2px 10px}
.asist label{flex-direction:row;gap:6px;font-weight:500;color:var(--ink);font-size:13.5px;align-items:center}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}

/* tamizaje */
.q{border:0;margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts label{border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;background:var(--surface);font-weight:500;color:var(--ink);flex-direction:row;display:flex;align-items:center;gap:6px;font-size:14px}
.opts label:has(input:checked){border-color:var(--navy);background:var(--amber-soft)}

/* estándares */
.std{display:grid;grid-template-columns:62px 1fr auto;gap:10px 14px;align-items:start;padding:10px 14px;border-bottom:1px solid var(--line)}
.std:last-child{border-bottom:0}
.std .cod{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.std .w{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].c{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"].n{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"].a{background:var(--surface-2);color:var(--ink)}
.ciclo{background:var(--surface-2);padding:9px 14px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}

/* informe */
.paper{background:#FFFFFF;color:#1B2530;border:1px solid var(--line);border-radius:6px;padding:28px 32px;font-size:13.5px;line-height:1.6;max-width:780px;margin:0 auto}
.paper .lh{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid #1E3A4C;padding-bottom:10px;margin-bottom:16px}
.paper .lh img{max-height:56px;max-width:150px;object-fit:contain}
.paper .lh b{display:block;font-family:var(--f-display);font-size:19px;color:#1E3A4C}
.paper .lh span{font-size:12px;color:#56676F}
.paper h4{color:#1E3A4C;margin:14px 0 4px;font-size:16px}
.paper p{margin:0 0 8px}
.paper table{font-size:12.5px;margin:4px 0 10px}
.paper th,.paper td{border-bottom:1px solid #DCE3E2;padding:4px 6px;text-align:left}
.paper .firma{margin-top:22px;padding-top:10px;border-top:1.5px solid #1B2530;font-size:13px}
.paper .borr{background:#FAEFD0;color:#6B4E00;border-radius:6px;padding:8px 12px;margin-bottom:12px;font-weight:600}

/* acceso */
.acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:28px;background:linear-gradient(180deg,var(--navy) 0 38%,var(--bg) 38%)}
.acceso .caja{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px 26px 22px;width:min(440px,100%)}
.acceso .brand b{font-size:30px;color:var(--ink)}
.acceso .brand .tower{color:var(--navy)}
.acceso form{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.acceso label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
.acceso .field{font-weight:500;color:var(--ink);font-size:15px;padding:10px 12px}
.acceso .btn{justify-content:center;padding:11px 14px}
.tabs2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.tabs2 button{flex:1;background:var(--surface);border:0;padding:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.msg{color:var(--bad);font-weight:600;font-size:13.5px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}

/* gráfico de barras */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%}

.logoprev{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logoprev .lg{width:120px;height:72px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden}
.logoprev .lg img{max-width:100%;max-height:100%;object-fit:contain}
.thumb{width:44px;height:28px;object-fit:contain;background:#fff;border-radius:4px;border:1px solid var(--line)}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;background:#1F8A4C;color:#fff;border:0;border-radius:99px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow)}
.fab:hover{filter:brightness(1.08)}
.fab i{font-style:normal;background:#fff;color:#1F8A4C;border-radius:99px;padding:0 7px;font-size:12px}
@media (max-width:560px){.fab span{display:none}.fab{padding:13px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;box-shadow:var(--shadow);z-index:200;max-width:calc(100vw - 32px)}
.modo{background:var(--info-bg);color:var(--info);font-size:12.5px;font-weight:600;text-align:center;padding:5px 12px}

@media (max-width:720px){
  .form,.clin{grid-template-columns:1fr}
  .watch li{grid-template-columns:1fr;gap:4px}
  .std{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 34px}
  .co{border-left:0;padding-left:0}
  main{padding-inline:16px}
  nav.menu{top:auto;position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"><div class="loading">Cargando Centinela SST…</div></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(() => {
'use strict';
/* =================== utilidades =================== */

/* Festivos de Colombia (Ley 51 de 1983, traslado a lunes) */
const festCache = {};
function festivos(y){
  if (festCache[y]) return festCache[y];
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  const pascua = y + '-' + String(mes).padStart(2,'0') + '-' + String(dia).padStart(2,'0');
  const lunes = iso => { const d = d12(iso); const w = d.getDay(); if (w !== 1) d.setDate(d.getDate() + ((8 - w) % 7)); return isoD(d); };
  const p = s => y + '-' + s;
  const set = new Set([p('01-01'), p('05-01'), p('07-20'), p('08-07'), p('12-08'), p('12-25'),
    lunes(p('01-06')), lunes(p('03-19')), lunes(p('06-29')), lunes(p('08-15')), lunes(p('10-12')), lunes(p('11-01')), lunes(p('11-11')),
    addD(pascua, -3), addD(pascua, -2), addD(pascua, 43), addD(pascua, 64), addD(pascua, 71)]);
  return festCache[y] = set;
}
const esHabil = iso => { const w = d12(iso).getDay(); return w !== 0 && w !== 6 && !festivos(+iso.slice(0,4)).has(iso); };
function habiles(iso, n){ let d = iso, k = 0; while (k < n){ d = addD(d, 1); if (esHabil(d)) k++; } return d; }
function habilesMes(y, m){ let n = 0; const dias = new Date(y, m, 0).getDate(); for (let i = 1; i <= dias; i++){ if (esHabil(y + '-' + String(m).padStart(2,'0') + '-' + String(i).padStart(2,'0'))) n++; } return n; }

/* NIT: dígito de verificación DIAN */
function dvNit(nit){
  const n = String(nit).replace(/\D/g,''); const pesos = [3,7,13,17,19,23,29,37,41,43,47,53,59,67,71];
  let s = 0; for (let i = 0; i < n.length; i++) s += Number(n[n.length - 1 - i]) * pesos[i];
  const r = s % 11; return r > 1 ? 11 - r : r;
}

/* En Claude: base de datos del artifact (capacidad db). Sin ella: memoria (se pierde al recargar).
   En SiteGround esta misma capa se conectará a api.php + MySQL. */
let DBX = null, DL = null, MODO = 'cargando';
const MEM = {}, MEMSUB = {};
const splitPath = p => { const i = p.lastIndexOf('/'); return [p.slice(0, i), p.slice(i + 1)]; };
const Data = {
  async set(path, data){
    if (API.url){ await API.call('PUT', '/api/doc', { ruta:path, data }); const [c, id] = splitPath(path); (MEM[c] ||= {})[id] = clone(data); memNotify(c); return; }
    if (DBX){ try { await DBX.doc(path).set(data); } catch(e){ if (e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 400 + Math.random()*600)); await DBX.doc(path).set(data); } else throw e; } return; }
    const [c, id] = splitPath(path); (MEM[c] ||= {})[id] = clone(data); memNotify(c);
  },
  async del(path){
    if (API.url){ await API.call('DELETE', '/api/doc?ruta=' + encodeURIComponent(path)); const [c, id] = splitPath(path); if (MEM[c]) delete MEM[c][id]; memNotify(c); return; }
    if (DBX){ await DBX.doc(path).delete(); return; }
    const [c, id] = splitPath(path); if (MEM[c]) delete MEM[c][id]; memNotify(c);
  },
  sub(col, cb){
    if (DBX){
      return DBX.collection(col).onSnapshot(s => {
        const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); cb(o, s.metadata.fromCache);
      }, e => { console.warn('db', col, e); if (e && e.code === 'unavailable') setTimeout(() => Data.sub(col, cb), 1500); });
    }
    (MEMSUB[col] ||= new Set()).add(cb); setTimeout(() => cb({ ...(MEM[col] || {}) }, false), 0);
    return () => MEMSUB[col]?.delete(cb);
  }
};
/* ---------- versión en servidor (GitHub Pages + Render + Neon) ---------- */
const API = { url:(typeof window !== 'undefined' && window.CENTINELA_API) || null, token:null, epoch:'', since:0, hay:true, listo:false, timer:null,
  async call(method, ruta, body){
    let r; try { r = await fetch(API.url + ruta, { method, headers:{ 'Content-Type':'application/json', ...(API.token ? { Authorization:'Bearer ' + API.token } : {}) }, body:body ? JSON.stringify(body) : undefined }); }
    catch(e){ throw { code:'unavailable', message:'Sin conexión con el servidor' }; }
    let j = null; try { j = await r.json(); } catch(e){}
    if (r.status === 401 && API.token && ruta !== '/api/clave'){ API.token = null; SES = null; guardarSes(); toast('Su sesión terminó. Entre de nuevo.'); setTimeout(() => location.reload(), 1200); }
    if (!r.ok) throw { code:(j && j.code) || 'http_' + r.status, message:(j && j.message) || '' };
    return j;
  },
  async sync(){
    if (!API.token) return;
    const j = await API.call('GET', '/api/sync?since=' + API.since + '&epoch=' + encodeURIComponent(API.epoch));
    const tocadas = new Set();
    if (j.completo) Object.keys(MEM).forEach(c => { if (Object.keys(MEM[c]).length){ MEM[c] = {}; tocadas.add(c); } });
    j.cambios.forEach(({ ruta, data }) => { const [c, id] = splitPath(ruta); MEM[c] ||= {}; if (data === null) delete MEM[c][id]; else MEM[c][id] = data; tocadas.add(c); });
    API.epoch = j.epoch; API.since = j.ahora; tocadas.forEach(memNotify);
    if (!API.listo){ API.listo = true; MODO = 'api'; pedirRender(); }
  },
  arrancar(){ clearInterval(API.timer); API.sync().catch(e => console.warn('sync', e)); API.timer = setInterval(() => { if (document.visibilityState === 'visible') API.sync().catch(() => {}); }, 20000); },
  entrar(token){ API.token = token; API.since = 0; API.epoch = ''; API.listo = false; MODO = 'cargando'; API.arrancar(); }
};
document.addEventListener('visibilitychange', () => { if (API.url && API.token && document.visibilityState === 'visible') API.sync().catch(() => {}); });
function memNotify(c){ const o = { ...(MEM[c] || {}) }; (MEMSUB[c] || []).forEach(cb => cb(o, false)); }
function errGuardar(e){
  console.error(e);
  if (e && e.code === 'quota_exceeded') toast('La base de pruebas está llena. Borre registros de prueba para seguir.');
  else if (e && (e.code === 'invalid_argument' || e.code === 'forbidden')) toast('No tiene permiso para guardar en esta vista.');
  else if (e && e.code === 'usuario_existe') toast('Ese usuario ya existe. Elija otro.');
  else if (e && e.code === 'too_large') toast('El archivo es demasiado grande.');
  else toast('No se pudo guardar. Revise su conexión e intente de nuevo.');
}

async function hashClave(clave, sal){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(sal), iterations:120000, hash:'SHA-256' }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function estadoVence(iso){

function calificacion(anio){
  const n = activos().length, g = grupoEstandares(emp(), n);
  const est = C.d.estandares?.[String(anio)]?.items || {};
  let tot = 0, ok = 0, evaluados = 0; const items = [];
  EST60.forEach(([ciclo, grupo, its]) => its.forEach(([cod, txt, w]) => {
    if (g.lista && !g.lista.includes(cod)) return;
    items.push({ cod, txt, w, ciclo, grupo, ...(est[cod] || {}) });
    tot += w; const s = est[cod]?.estado;
    if (s) evaluados++;
    if (s === 'cumple' || s === 'na') ok += w;
  }));
  const p = tot ? Math.round(ok / tot * 1000) / 10 : 0;
  return { g, items, p, evaluados, total:items.length };
}

async function login(form){
  if (API.url) return loginAPI(form);
  const fd = new FormData(form); const us = String(fd.get('usuario') || '').trim().toLowerCase(), cl = String(fd.get('clave') || '');
  const msg = $('#l-msg');
  const ent = Object.entries(G.usuarios).find(([, u]) => u.usuario === us);
  if (!ent){ msg.textContent = 'Usuario o contraseña incorrectos.'; return; }
  const [uid, u] = ent;
  if (await hashClave(cl, u.sal) !== u.hash){ msg.textContent = 'Usuario o contraseña incorrectos.'; return; }
  if (u.activo === false){ msg.textContent = 'Este usuario está desactivado. Hable con el administrador de su empresa.'; return; }
  SES = { uid }; guardarSes(); UI.vista = 'inicio';
  if (u.rol !== 'super') entrarEmpresa(u.empresa);
  render();
  if (u.cambiarClave) setTimeout(() => dlgClave(true), 50);
}
async function loginTrab(form){
  if (API.url) return loginTrabAPI(form);
  const fd = new FormData(form); const nit = String(fd.get('nit') || '').replace(/\D/g,''), doc = String(fd.get('doc') || '').replace(/\s/g,''), cod = String(fd.get('cod') || '').trim();
  const msg = $('#t-msg');
  const ent = Object.entries(G.empresas).find(([, e]) => String(e.nit) === nit);
  if (!ent){ msg.textContent = 'No encontramos una empresa con ese NIT.'; return; }
  const [cid, e] = ent;
  if (estadoSuscripcion(e).bloquea){ msg.textContent = 'El servicio de su empresa no está activo en este momento.'; return; }
  msg.textContent = 'Verificando…';
  const trabajadores = await new Promise(res => { let un; un = Data.sub('e/' + cid + '/trabajadores', (o, cache) => { if (!cache){ res(o); setTimeout(() => un && un(), 0); } }); });
  const hit = Object.entries(trabajadores).find(([, t]) => String(t.documento) === doc && String(t.codigo) === cod && t.estado !== 'retirado');
  if (!hit){ msg.textContent = 'El documento o el código no coinciden. Pida su código al área de SST.'; return; }
  SES = { trab:{ cid, tid:hit[0] } }; guardarSes(); UI.portal = null;
  entrarEmpresa(cid); render();
}
async function loginAPI(form){
  const fd = new FormData(form); const msg = $('#l-msg'); msg.textContent = 'Verificando…';
  try { const j = await API.call('POST', '/api/login', { usuario:String(fd.get('usuario') || '').trim().toLowerCase(), clave:String(fd.get('clave') || '') });
    SES = { uid:j.uid, token:j.token }; guardarSes(); UI.vista = 'inicio'; API.entrar(j.token); render();

}

function barrasProgramas(){

  const res = clin ? Object.keys(PROGRAMAS).map(p => { const cs = casos.filter(c => c.programa === p); return { p, a:cs.filter(c => c.nivel === 'alto').length, m:cs.filter(c => c.nivel !== 'alto').length }; }) : (emp().resumenVigilancia || null);

async function publicarResumen(){
  if (!puede.clinico() || rol() !== 'medico') return;
  const casos = lista('casos').filter(c => c.estado !== 'Cerrado');
  const res = Object.keys(PROGRAMAS).map(p => { const cs = casos.filter(c => c.programa === p); return { p, a:cs.filter(c => c.nivel === 'alto').length, m:cs.filter(c => c.nivel !== 'alto').length }; });
  const e = emp(); if (!e) return;

const COLS_IMP = [['tipo_documento','tipoDoc'],['documento','documento'],['nombres','nombres'],['apellidos','apellidos'],['sexo','sexo'],['fecha_nacimiento','nacimiento'],['cargo','cargo'],['area','area'],['sede','sede'],['fecha_ingreso','ingreso'],['eps','eps'],['afp','afp'],['correo','correo'],['celular','celular'],['escolaridad','escolaridad']];
function dlgImportar(){

  `<div class="form"><label class="full">Archivo<input class="field" id="imp-file" name="archivo" type="file" accept=".xlsx,.xls,.csv"></label>
   <p class="hint">Columnas reconocidas: <span class="mono">${COLS_IMP.map(c => c[0]).join(', ')}</span>. Si el documento ya existe, se actualizan sus datos. Los cargos que no existan se crean en el profesiograma. Fechas en formato AAAA-MM-DD.</p>

}
const normCol = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'');
function fechaCelda(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number'){ const d = new Date(Math.round((v - 25569) * DIA)); return isoD(d); }
  const s = String(v).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); if (m) return m[3] + '-' + m[2].padStart(2,'0') + '-' + m[1].padStart(2,'0');
  return '';
}
async function importar(form){
  const f = form.querySelector('#imp-file').files[0];
  if (!f) return errForm(form, 'Seleccione un archivo.');
  if (typeof XLSX === 'undefined') return errForm(form, 'No cargó el lector de Excel. Revise su conexión y recargue.');
  const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
  const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
  if (!filas.length) return errForm(form, 'El archivo no tiene filas.');
  const porDoc = {}; trabs().forEach(t => porDoc[String(t.documento)] = t);
  const cargosN = {}; cargos().forEach(c => cargosN[c.nombre.toLowerCase()] = c.id);
  let nuevos = 0, act = 0, err = 0; const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  for (const fila of filas){
    const r = {}; Object.keys(fila).forEach(k => { const col = COLS_IMP.find(c => c[0] === normCol(k)); if (col) r[col[1]] = String(fila[k]).trim(); });
    ['nacimiento','ingreso'].forEach(k => { const orig = Object.keys(fila).find(x => normCol(x) === (k === 'ingreso' ? 'fecha_ingreso' : 'fecha_nacimiento')); if (orig) r[k] = fechaCelda(fila[orig]); });
    r.documento = String(r.documento || '').replace(/\D/g,'');
    if (!r.documento || !r.nombres){ err++; continue; }
    if (r.cargo){
      const k = r.cargo.toLowerCase();
      if (!cargosN[k]){ const cid = genId('c'); cargosN[k] = cid; await Data.set('e/' + C.cid + '/cargos/' + cid, { nombre:r.cargo, peligros:[], examenes:['Evaluación médica ocupacional'], periodicidad:12, creado:marca() }); }
      r.cargo = cargosN[k];
    }
    if (r.sexo) r.sexo = r.sexo[0].toUpperCase();
    const prev = porDoc[r.documento];
    const doc = { tipoDoc:'CC', estado:'activo', ...(prev ? clone(prev) : { codigo:codigoPortal(), creado:marca() }), ...Object.fromEntries(Object.entries(r).filter(([, v]) => v !== '')) };
    delete doc.id; if (!doc.apellidos) doc.apellidos = '';
    const id = prev ? prev.id : genId('t');
    try { await Data.set('e/' + C.cid + '/trabajadores/' + id, doc); prev ? act++ : nuevos++; } catch(e){ err++; }
  }
  await bitacora('Importó trabajadores', `${nuevos} nuevos, ${act} actualizados desde ${f.name}`);
  await sincronizarConteo();
  cerrar(); toast(`${nuevos} trabajadores nuevos y ${act} actualizados${err ? ` · ${err} filas sin documento o nombre` : ''}`);
}
async function plantilla(){
  if (typeof XLSX === 'undefined') return toast('No cargó el generador de Excel.');
  const ws = XLSX.utils.aoa_to_sheet([COLS_IMP.map(c => c[0]), ['CC','1082000111','Ana María','Pérez Gómez','F','1990-04-12','Auxiliar administrativa','Administración','Santa Marta','2024-02-01','Nueva EPS','Porvenir','ana@correo.com','3001234567','Profesional']]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Trabajadores');

}

  if (!clin){
    return `${head('Vigilancia epidemiológica', 'Como empresa usted ve cuántos casos hay por programa, sin datos clínicos. Las acciones que le tocan a la empresa están en Tareas.', '')}
    <section class="box" style="max-width:720px">${barrasProgramas()}</section>
    <p class="lock" style="margin-top:14px">Los nombres, hallazgos y notas de cada caso solo los ven el médico y el psicólogo SST (reserva de la historia clínica, Resolución 1995 de 1999 y Ley 1581 de 2012).</p>`;
  }
  const f = UI.f.prog;
  const cs = lista('casos').filter(c => puede.programa(c.programa)).filter(c => !f || c.programa === f).sort((a,b) => (a.estado === 'Cerrado') - (b.estado === 'Cerrado') || (b.nivel === 'alto') - (a.nivel === 'alto') || a.abierto.localeCompare(b.abierto));
  return `${head('Vigilancia epidemiológica', 'Los casos entran solos cuando un tamizaje da riesgo medio o alto, o cuando usted los abre desde una evaluación. Un caso solo se cierra con su motivo registrado.', '<button class="btn pri" type="button" data-act="caso">+ Abrir caso</button>')}
  <div class="toolbar"><select id="f-prog" data-f="prog" aria-label="Programa">${opts(Object.entries(PROGRAMAS).filter(([k]) => puede.programa(k)), f, 'Todos los programas')}</select></div>
  <div class="tw"><table class="t"><thead><tr><th>Trabajador</th><th>Programa</th><th>Nivel</th><th>Abierto</th><th>Último seguimiento</th><th>Estado</th></tr></thead><tbody>
  ${cs.map(c => { const t = tById(c.trabajador); const ult = (c.notas || []).slice(-1)[0];
    return `<tr class="click ${c.estado === 'Cerrado' ? 'off' : ''}" data-act="caso" data-id="${c.id}" tabindex="0"><td class="nm">${esc(nombreT(t))}<span class="sub">${esc(cargoN(t?.cargo))}</span></td><td>${PROGRAMAS[c.programa]}${c.el ? '<span class="sub">Enfermedad laboral calificada</span>' : ''}</td><td>${nivelPill(c.nivel)}</td><td class="num">${fmt(c.abierto)}<span class="sub">${esc(c.origen)}</span></td><td style="max-width:320px">${ult ? `${esc(ult.texto)}<span class="sub">${fmt(ult.fecha)} · ${esc(ult.por)}</span>` : '—'}</td><td>${pill(c.estado, c.estado === 'Cerrado' ? '' : c.estado === 'Abierto' ? 'p-warn' : 'p-info')}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">Sin casos.</td></tr>'}
  </tbody></table></div>
  <p class="norma"><b>Normas:</b> Decreto 1072 de 2015 (vigilancia de la salud de los trabajadores) · Resolución 0312 de 2019 (estándares 3.1.1 a 3.3.6) · la historia clínica y sus anexos son reservados (Resolución 1995 de 1999).</p>`;
};

  const cerr = c.estado === 'Cerrado';
  formDlg('caso', id ? 'Caso de vigilancia' : 'Abrir caso de vigilancia', id ? esc(nombreT(tById(c.trabajador))) + ' · abierto el ' + fmt(c.abierto) : '',
  `<div class="form"><input type="hidden" name="id" value="${esc(id || '')}">
    ${id ? '' : `<label class="full">Trabajador<select class="field" id="k-t" name="trabajador" required>${optsTrab('')}</select></label>`}
    <label>Programa<select class="field" id="k-p" name="programa">${opts(Object.entries(PROGRAMAS).filter(([k]) => puede.programa(k)), c.programa)}</select></label>
    <label>Nivel de riesgo<select class="field" id="k-n" name="nivel">${opts([['bajo','Riesgo bajo'],['medio','Riesgo medio'],['alto','Riesgo alto']], c.nivel)}</select></label>
    <label>Estado<select class="field" id="k-e" name="estado">${opts(['Abierto','En seguimiento','Cerrado'], c.estado)}</select></label>
    <label>Motivo de cierre (obligatorio para cerrar)<input class="field" id="k-m" name="motivoCierre" value="${esc(c.motivoCierre)}"></label>
    <label style="flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink)"><input type="checkbox" name="el" id="k-el" ${c.el ? 'checked' : ''}> Calificado como enfermedad laboral</label>
    <label>Fecha de calificación<input class="field" id="k-elf" name="elFecha" type="date" value="${esc(c.elFecha)}"></label>
    ${id ? `<div class="full"><div class="eyebrow" style="margin-bottom:6px">Seguimiento</div>${(c.notas || []).map(n => `<p style="margin:0 0 8px"><b class="small">${fmt(n.fecha)} · ${esc(n.por)}</b><br>${esc(n.texto)}</p>`).join('') || '<p class="small">Sin notas.</p>'}</div>` : ''}
    ${cerr ? '' : `<label class="full">${id ? 'Nueva nota de seguimiento' : 'Nota inicial'}<textarea class="field" id="k-nota" name="nota"></textarea></label>
    <label class="full">Tarea para la empresa (opcional)<input class="field" id="k-tarea" name="tarea" placeholder="Ej.: rotar de puesto cada 2 horas"></label>
    <label>Responsable de la tarea<input class="field" id="k-resp" name="responsable" list="dl-resp" value="Administrador SG-SST"></label>
    <label>Fecha límite<input class="field" id="k-venc" name="vence" type="date" value="${addD(HOY, 15)}"></label>`}
  </div>${datalistResp()}`, null, true);
}
function datalistResp(){ return `<datalist id="dl-resp">${['Administrador SG-SST','Médico SST','Psicólogo SST','Auxiliar SST','Jefe inmediato','Talento humano','COPASST','Gerencia'].concat(usuariosEmpresa(C.cid).map(u => u.nombre)).map(x => `<option value="${esc(x)}">`).join('')}</datalist>`; }

/* ---------- tareas ---------- */
VIEWS.tareas = () => {
  const f = UI.f.tareas, q = (UI.q.tar || '').toLowerCase(); const ed = puede.editar();
  const ts = lista('tareas').filter(t => f === 'todas' || (f === 'pendientes' ? t.estado !== 'cumplida' : f === 'vencidas' ? (t.estado !== 'cumplida' && diasA(t.vence) < 0) : t.estado === 'cumplida'))
    .filter(t => !q || (t.texto + ' ' + (t.responsable || '') + ' ' + nombreT(tById(t.trabajador))).toLowerCase().includes(q))
    .sort((a,b) => (a.estado === 'cumplida') - (b.estado === 'cumplida') || a.vence.localeCompare(b.vence));
  const todas = lista('tareas'), cum = todas.filter(t => t.estado === 'cumplida').length;
  return `${head('Tareas y seguimiento', `Cada restricción, recomendación, hallazgo o no conformidad se vuelve una tarea con responsable y fecha. Cumplimiento: <b>${cum} de ${todas.length}</b> (${pct(cum, todas.length)} %).`, ed ? '<button class="btn pri" type="button" data-act="tarea">+ Tarea</button>' : '')}
  <div class="toolbar"><input type="search" id="q-tar" data-q="tar" placeholder="Buscar por tarea, responsable o trabajador" value="${esc(UI.q.tar || '')}" aria-label="Buscar tareas">
  <select id="f-tareas" data-f="tareas" aria-label="Estado">${opts([['pendientes','Pendientes'],['vencidas','Vencidas'],['cumplidas','Cumplidas'],['todas','Todas']], f)}</select></div>
  <div class="tw"><table class="t"><thead><tr><th>Vence</th><th>Tarea</th><th>Trabajador</th><th>Responsable</th><th>Origen</th><th>Estado</th><th></th></tr></thead><tbody>
  ${ts.map(t => { const d = diasA(t.vence);
    const st = t.estado === 'cumplida' ? pill('Cumplida ' + fmt(t.cumplida?.fecha), 'p-ok') : d < 0 ? pill('Vencida', 'p-bad') : d <= 7 ? pill('Por vencer', 'p-warn') : pill('En plazo', 'p-info');
    return `<tr class="${t.estado === 'cumplida' ? 'off' : ''}"><td class="num">${fmt(t.vence)}</td><td style="max-width:340px">${esc(t.texto)}${t.cumplida?.evidencia ? `<span class="sub">Evidencia: ${esc(t.cumplida.evidencia)}</span>` : ''}</td><td>${t.trabajador ? esc(nombreT(tById(t.trabajador))) : '—'}</td><td>${esc(t.responsable || '—')}</td><td><span class="small">${esc(t.origen || 'Manual')}</span></td><td>${st}</td>
    <td style="white-space:nowrap">${ed && t.estado !== 'cumplida' ? `<button class="btn sm" type="button" data-act="cumplir" data-id="${t.id}">Cumplida</button> ` : ''}${ed ? `<button class="btn gh sm" type="button" data-act="tarea" data-id="${t.id}">Editar</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">No hay tareas con ese filtro.</td></tr>'}
  </tbody></table></div>`;
};
function dlgTarea(id){
  const t = id ? { ...C.d.tareas[id] } : { vence:addD(HOY, 7), responsable:'Administrador SG-SST', origen:'Manual' };
  formDlg('tarea', id ? 'Editar tarea' : 'Nueva tarea', '',
  `<div class="form"><input type="hidden" name="id" value="${esc(id || '')}">
    <label class="full">Tarea<textarea class="field" id="ta-t" name="texto" required>${esc(t.texto)}</textarea></label>
    <label>Responsable<input class="field" id="ta-r" name="responsable" list="dl-resp" value="${esc(t.responsable)}" required></label>
    <label>Fecha límite<input class="field" id="ta-v" name="vence" type="date" value="${esc(t.vence)}" required></label>
    <label>Trabajador relacionado (opcional)<select class="field" id="ta-w" name="trabajador">${optsTrab(t.trabajador, true).replace('Seleccione el trabajador','Ninguno')}</select></label>
    <label>Origen<select class="field" id="ta-o" name="origen">${opts(['Manual','Evaluación médica','Tamizaje','Vigilancia','Accidente','Estándares mínimos','Inspección','COPASST','Plan anual de trabajo'], t.origen)}</select></label>
  </div>${datalistResp()}`, (id && puede.gestion() ? `<button class="btn dan sp" type="button" data-act="borrar" data-col="tareas" data-id="${id}">Eliminar</button>` : '') + '<button class="btn" type="button" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Guardar</button>');
}

/* ---------- accidentes ---------- */
VIEWS.accidentes = () => {
  const ed = puede.editar(); const as = lista('accidentes').sort((a,b) => b.fecha.localeCompare(a.fecha));
  const anio = as.filter(a => a.fecha.startsWith(String(ANIO)));
  return `${head('Accidentes e incidentes', `En ${ANIO}: ${anio.filter(a => a.tipo !== 'Incidente').length} accidentes, ${anio.filter(a => a.tipo === 'Incidente').length} incidentes, ${anio.reduce((s, a) => s + Number(a.dias || 0), 0)} días de incapacidad.`, ed ? '<button class="btn pri" type="button" data-act="accidente">+ Registrar evento</button>' : '')}
  <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Trabajador</th><th>Tipo</th><th>Descripción</th><th class="r">Días</th><th>Reporte ARL</th><th>Investigación</th><th></th></tr></thead><tbody>
  ${as.map(a => { const t = tById(a.trabajador); const lim = habiles(a.fecha, 2), limI = addD(a.fecha, 15);
    return `<tr><td class="num">${fmt(a.fecha)}</td><td class="nm">${esc(nombreT(t))}<span class="sub">${esc(cargoN(t?.cargo))}</span></td><td>${pill(a.tipo, a.tipo === 'Incidente' ? 'p-info' : a.tipo === 'Accidente leve' ? 'p-warn' : 'p-bad')}</td><td style="max-width:280px">${esc(a.descripcion)}<span class="sub">${esc(a.lugar || '')}</span></td><td class="r num">${a.dias || 0}</td>
    <td>${a.tipo === 'Incidente' ? '<span class="small">No aplica</span>' : a.reporteARL ? pill(fmt(a.reporteARL), 'p-ok') : pill('Plazo ' + fmt(lim), diasA(lim) < 0 ? 'p-bad' : 'p-warn')}</td>
    <td>${a.investigacion ? pill(fmt(a.investigacion), 'p-ok') : pill('Plazo ' + fmt(limI), diasA(limI) < 0 ? 'p-bad' : 'p-warn')}</td>
    <td style="white-space:nowrap">${ed ? `<button class="btn sm" type="button" data-act="accidente" data-id="${a.id}">Abrir</button> ` : ''}${a.tipo !== 'Incidente' && ed ? waBtn(waTexto(a.tipo.toUpperCase() + ' DE TRABAJO', [...ctxEmpresa(), `Trabajador: ${nombreT(t)}, ${t?.tipoDoc || ''} ${t?.documento || ''}, cargo ${cargoN(t?.cargo)}`, `Evento: ${a.tipo} del ${fmt(a.fecha)}${a.hora ? ' a las ' + a.hora : ''}${a.lugar ? ' en ' + a.lugar : ''}`, `Qué pasó: ${a.descripcion}`, 'Solicitamos: valoración médica y orientación']), 'Avisar a la IPS', null, true) : ''}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Sin eventos registrados.</td></tr>'}
  </tbody></table></div>
  <p class="norma"><b>Normas:</b> Resolución 156 de 2005 y Decreto 1072 de 2015 (reporte del accidente a la ARL y EPS dentro de los 2 días hábiles siguientes, FURAT) · Resolución 1401 de 2007 (investigación dentro de los 15 días siguientes; los graves y mortales se remiten a la ARL) · Resolución 0312 de 2019 (estándares 3.2.1 y 3.2.2).</p>`;
};

    <label>Tipo<select class="field" id="ac-tipo" name="tipo">${opts(TIPO_AT, a.tipo)}</select></label>
    <label>Fecha<input class="field" id="ac-f" name="fecha" type="date" value="${esc(a.fecha)}" required></label>
    <label>Hora<input class="field" id="ac-h" name="hora" type="time" value="${esc(a.hora)}"></label>

    <label class="full">Qué pasó<textarea class="field" id="ac-d" name="descripcion" required>${esc(a.descripcion)}</textarea></label>
    <label>Días de incapacidad<input class="field" id="ac-dias" name="dias" type="number" min="0" value="${esc(a.dias)}"></label>
    <label>Días cargados (secuelas)<input class="field" id="ac-car" name="cargados" type="number" min="0" value="${esc(a.cargados)}"></label>

/* ---------- ausentismo ---------- */
VIEWS.ausentismo = () => {
  const ed = puede.editar(); const is = lista('incapacidades').sort((a,b) => b.desde.localeCompare(a.desde));
  const anio = is.filter(x => x.desde.startsWith(String(ANIO)));
  const por = {}; anio.forEach(x => por[x.origen] = (por[x.origen] || 0) + Number(x.dias || 0));
  const tot = Object.values(por).reduce((a,b) => a + b, 0); const max = Math.max(1, ...Object.values(por));
  return `${head('Ausentismo por causa médica', `${tot} días de incapacidad en ${ANIO}.`, ed ? '<button class="btn pri" type="button" data-act="incap">+ Incapacidad</button>' : '')}
  ${tot ? `<section class="box" style="margin-bottom:14px;max-width:720px"><h4>Días por origen · ${ANIO}</h4><div class="bars" style="margin-top:10px">${Object.entries(por).sort((a,b) => b[1] - a[1]).map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><div class="track"><i style="width:${v / max * 100}%;background:var(--navy-2)"></i></div><span class="num">${v}</span></div>`).join('')}</div></section>` : ''}
  <div class="tw"><table class="t"><thead><tr><th>Trabajador</th><th>Origen</th><th>Desde</th><th>Hasta</th><th class="r">Días</th><th></th></tr></thead><tbody>
  ${is.map(x => `<tr><td class="nm">${esc(nombreT(tById(x.trabajador)))}</td><td>${esc(x.origen)}</td><td class="num">${fmt(x.desde)}</td><td class="num">${fmt(x.hasta)}</td><td class="r num">${x.dias}</td><td>${ed ? `<button class="btn gh sm" type="button" data-act="incap" data-id="${x.id}">Editar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin incapacidades registradas.</td></tr>'}
  </tbody></table></div>
  <p class="norma"><b>Norma:</b> Resolución 0312 de 2019, art. 30: proporción de días de ausencia por incapacidad laboral o común frente a los días de trabajo programados. El diagnóstico no se registra aquí: es información reservada.</p>`;
};
function dlgIncap(id){
  const x = id ? { ...C.d.incapacidades[id] } : { desde:HOY, hasta:HOY, origen:'Enfermedad general' };
  formDlg('incap', id ? 'Editar incapacidad' : 'Registrar incapacidad', 'Los días se calculan con las fechas (calendario).',

    <label class="full">Trabajador<select class="field" id="in-t" name="trabajador" required>${optsTrab(x.trabajador, true)}</select></label>
    <label class="full">Origen<select class="field" id="in-o" name="origen">${opts(ORIGEN_INC, x.origen)}</select></label>
    <label>Desde<input class="field" id="in-d" name="desde" type="date" value="${esc(x.desde)}" required></label>

    <p class="hint">Al terminar una incapacidad larga, Centinela le recuerda la evaluación médica post incapacidad.</p>
  </div>`, (id && puede.gestion() ? `<button class="btn dan sp" type="button" data-act="borrar" data-col="incapacidades" data-id="${id}">Eliminar</button>` : '') + '<button class="btn" type="button" data-act="cerrar">Cancelar</button><button class="btn pri" type="submit">Guardar</button>');
}

/* ---------- capacitaciones ---------- */
VIEWS.capacitaciones = () => {
  const ed = puede.editar(); const cs = lista('capacitaciones').sort((a,b) => b.fecha.localeCompare(a.fecha));
  const act = activos(); const conInd = new Set(); const conCap = new Set();
  cs.forEach(c => (c.asistentes || []).forEach(t => { if (c.tipo === 'Inducción' || c.tipo === 'Reinducción') conInd.add(t); if (c.fecha.startsWith(String(ANIO))) conCap.add(t); }));
  const sinInd = act.filter(t => !conInd.has(t.id));
  return `${head('Capacitaciones', `Cobertura ${ANIO}: <b>${act.filter(t => conCap.has(t.id)).length} de ${act.length}</b> trabajadores activos con al menos una capacitación. ${sinInd.length ? `<b>${sinInd.length}</b> sin inducción registrada.` : 'Todos tienen inducción.'}`, ed ? '<button class="btn pri" type="button" data-act="capac">+ Capacitación</button>' : '')}
  <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Tema</th><th>Tipo</th><th class="r">Horas</th><th class="r">Asistentes</th><th>Facilitador</th><th></th></tr></thead><tbody>
  ${cs.map(c => `<tr><td class="num">${fmt(c.fecha)}</td><td class="nm">${esc(c.tema)}${diasA(c.fecha) >= -3 && diasA(c.fecha) <= 0 ? `<span class="sub">Código de asistencia para el portal: <b class="mono">${codCap(c.id)}</b></span>` : ''}</td><td>${esc(c.tipo)}</td><td class="r num">${c.horas}</td><td class="r num">${(c.asistentes || []).length}</td><td>${esc(c.facilitador || '—')}</td><td>${ed ? `<button class="btn gh sm" type="button" data-act="capac" data-id="${c.id}">Editar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Sin capacitaciones registradas.</td></tr>'}
  </tbody></table></div>
  ${sinInd.length ? `<p class="small" style="margin-top:12px">Sin inducción: ${sinInd.slice(0, 20).map(t => esc(nombreT(t))).join(', ')}${sinInd.length > 20 ? '…' : ''}</p>` : ''}
  <p class="norma"><b>Normas:</b> Decreto 1072 de 2015 (art. 2.2.4.6.11, capacitación e inducción en SST) · Resolución 0312 de 2019 (estándares 1.2.1 y 1.2.2).</p>`;
};
function dlgCapac(id){
  const c = id ? { ...C.d.capacitaciones[id] } : { fecha:HOY, horas:1, tipo:'Capacitación', asistentes:[] };
  const set = new Set(c.asistentes || []);
  formDlg('capac', id ? 'Editar capacitación' : 'Registrar capacitación', '',
  `<div class="form"><input type="hidden" name="id" value="${esc(id || '')}">
    <label class="full">Tema<input class="field" id="cp-t" name="tema" value="${esc(c.tema)}" required></label>
    <label>Tipo<select class="field" id="cp-tipo" name="tipo">${opts(['Inducción','Reinducción','Capacitación','Simulacro','Entrenamiento de brigada','Pausas activas'], c.tipo)}</select></label>
    <label>Fecha<input class="field" id="cp-f" name="fecha" type="date" value="${esc(c.fecha)}" required></label>
    <label>Horas<input class="field" id="cp-h" name="horas" type="number" min="0.5" step="0.5" value="${esc(c.horas)}"></label>
    <label>Facilitador<input class="field" id="cp-fa" name="facilitador" value="${esc(c.facilitador)}"></label>

VIEWS.indicadores = () => {

    const m = String(i + 1).padStart(2,'0'), k = y + '-' + m;
    const ats = at.filter(a => a.fecha.startsWith(k));
    const dAT = ats.reduce((s, a) => s + Number(a.dias || 0) + Number(a.cargados || 0), 0);
    let dAus = 0; inc.forEach(x => { let d = x.desde; while (d <= x.hasta){ if (d.startsWith(k)) dAus++; d = addD(d, 1); } });
    const prog = habilesMes(y, i + 1) * n;
    return { k, mes:MESC[i], at:ats.length, frec: ats.length / n * 100, sev: dAT / n * 100, aus: prog ? dAus / prog * 100 : 0, dAus, futuro: k > HOY.slice(0,7) };
  });
  const mort = at.filter(a => a.tipo === 'Accidente mortal').length;
  const casosEL = puede.clinico() ? lista('casos').filter(c => c.el) : null;
  const elExist = casosEL ? casosEL.filter(c => !c.elFecha || c.elFecha <= y + '-12-31').length : null;
  const elNuevos = casosEL ? casosEL.filter(c => (c.elFecha || '').startsWith(String(y))).length : null;
  const f1 = v => v.toLocaleString('es-CO', { maximumFractionDigits:2 });
  const maxF = Math.max(0.01, ...meses.map(m => m.frec));
  return `${head('Indicadores del SG-SST', `Calculados con ${n} trabajadores activos como base mensual. Fórmulas del artículo 30 de la Resolución 0312 de 2019.`, `<select class="field" id="f-anioInd" data-f="anioInd" aria-label="Año">${opts([ANIO - 1, ANIO], y)}</select>`)}

    <div class="box stat"><b>${f1(at.length ? mort / at.length * 100 : 0)}%</b><span>Mortalidad por AT</span></div>
    <div class="box stat"><b>${elExist == null ? '—' : f1(elExist / n * 100000)}</b><span>Prevalencia de EL (por 100.000)</span></div>
    <div class="box stat"><b>${elNuevos == null ? '—' : f1(elNuevos / n * 100000)}</b><span>Incidencia de EL (por 100.000)</span></div>
  </div>
  <div class="tw"><table class="t"><thead><tr><th>Mes</th><th class="r">AT</th><th>Frecuencia (AT por 100 trabajadores)</th><th class="r">Severidad (días por 100 trab.)</th><th class="r">Ausentismo</th></tr></thead><tbody>
  ${meses.map(m => `<tr class="${m.futuro ? 'off' : ''}"><td>${m.mes} ${y}</td><td class="r num">${m.at}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="track" style="flex:1;max-width:220px"><i style="width:${m.frec / maxF * 100}%;background:var(--bad)"></i></div><span class="num">${f1(m.frec)}</span></div></td><td class="r num">${f1(m.sev)}</td><td class="r num">${f1(m.aus)} %</td></tr>`).join('')}
  </tbody></table></div>
  ${elExist == null ? '<p class="small" style="margin-top:10px">Prevalencia e incidencia de enfermedad laboral: las calcula el médico SST (usan datos de casos calificados).</p>' : ''}
  <p class="norma"><b>Fórmulas (Res. 0312/2019, art. 30):</b> frecuencia = AT del mes ÷ trabajadores × 100 · severidad = (días de incapacidad por AT + días cargados) ÷ trabajadores × 100 · mortalidad = AT mortales ÷ AT del año × 100 · prevalencia de EL = casos existentes ÷ promedio de trabajadores × 100.000 · incidencia de EL = casos nuevos ÷ promedio de trabajadores × 100.000 · ausentismo = días de ausencia por incapacidad ÷ días programados × 100 (días hábiles sin festivos).</p>`;
};

/* contenido de cada informe: lista de [título, texto] */
function contenidoInforme(tipo, P){
  const e = emp(), act = activos(), n = act.length, y = Number(P.anio || ANIO), Y = String(y);
  const enAnio = f => String(f || '').startsWith(Y);
  const tar = lista('tareas'), cum = tar.filter(t => t.estado === 'cumplida').length, venc = tar.filter(t => t.estado !== 'cumplida' && diasA(t.vence) < 0).length;
  const lineas = arr => arr.length ? arr.map(s => '• ' + s).join('\n') : 'Sin registros.';
  const cal = calificacion(y), band = bandaEstandares(cal.p);
  const ats = lista('accidentes').filter(a => enAnio(a.fecha));
  const atL = ats.filter(a => a.tipo !== 'Incidente');
  const caps = lista('capacitaciones').filter(c => enAnio(c.fecha));
  const inc = lista('incapacidades').filter(x => enAnio(x.desde));
  const diasInc = inc.reduce((s, x) => s + Number(x.dias || 0), 0);
  const progDias = [...Array(12)].reduce((s, _, i) => s + habilesMes(y, i + 1), 0) * Math.max(1, n);
  const resumenInd = () => {
    const nn = Math.max(1, n); const dAT = atL.reduce((s, a) => s + Number(a.dias || 0) + Number(a.cargados || 0), 0);
    return [`Accidentes de trabajo: ${atL.length}; incidentes: ${ats.length - atL.length}.`,
      `Frecuencia anual: ${(atL.length / nn * 100).toLocaleString('es-CO',{maximumFractionDigits:2})} accidentes por cada 100 trabajadores.`,
      `Severidad anual: ${(dAT / nn * 100).toLocaleString('es-CO',{maximumFractionDigits:2})} días perdidos por cada 100 trabajadores.`,
      `Mortalidad: ${atL.length ? (atL.filter(a => a.tipo === 'Accidente mortal').length / atL.length * 100).toLocaleString('es-CO',{maximumFractionDigits:2}) : 0} %.`,
      `Ausentismo por causa médica: ${(diasInc / progDias * 100).toLocaleString('es-CO',{maximumFractionDigits:2})} % (${diasInc} días frente a ${progDias} días programados).`,
      `Cumplimiento de tareas y recomendaciones: ${cum} de ${tar.length} (${pct(cum, tar.length)} %); ${venc} vencidas.`,
      `Estándares mínimos: ${cal.p} % (${band[0].toLowerCase()}).`];
  };
  const socio = () => {
    const sexo = { F:0, M:0, I:0, '':0 }; act.forEach(t => sexo[t.sexo || ''] = (sexo[t.sexo || ''] || 0) + 1);
    const eds = act.map(t => edad(t.nacimiento)).filter(x => x != null);
    const rangos = [['18 a 29', 18, 29], ['30 a 39', 30, 39], ['40 a 49', 40, 49], ['50 a 59', 50, 59], ['60 o más', 60, 200]].map(([t, a, b]) => t + ': ' + eds.filter(x => x >= a && x <= b).length).join(' · ');
    const cuenta = f => { const o = {}; act.forEach(t => { const k = f(t) || 'Sin dato'; o[k] = (o[k] || 0) + 1; }); return Object.entries(o).sort((a,b) => b[1] - a[1]).map(([k, v]) => `${k} (${v})`).join(', '); };
    const ant = act.map(t => t.ingreso ? (d12(HOY) - d12(t.ingreso)) / (365.25 * DIA) : null).filter(x => x != null);
    return [
      ['Población', `${n} trabajadores activos. Sexo: ${sexo.F} mujeres, ${sexo.M} hombres${sexo.I ? ', ' + sexo.I + ' intersexuales' : ''}${sexo[''] ? ', ' + sexo[''] + ' sin dato' : ''}.`],
      ['Edad', `${rangos}.${eds.length ? ` Promedio: ${Math.round(eds.reduce((a,b) => a + b, 0) / eds.length)} años.` : ''}${eds.length < n ? ` ${n - eds.length} sin fecha de nacimiento.` : ''}`],
      ['Cargos', cuenta(t => cargoN(t.cargo))], ['Áreas', cuenta(t => t.area)], ['Sedes', cuenta(t => t.sede)], ['Escolaridad', cuenta(t => t.escolaridad)],
      ['Antigüedad en la empresa', ant.length ? `Menos de 1 año: ${ant.filter(a => a < 1).length} · 1 a 5 años: ${ant.filter(a => a >= 1 && a < 5).length} · 5 años o más: ${ant.filter(a => a >= 5).length}.` : 'Sin datos.'],
      ['Seguridad social', `EPS: ${cuenta(t => t.eps)}. AFP: ${cuenta(t => t.afp)}. ARL de la empresa: ${e.arl || 'sin registrar'}.`]
    ];
  };
  switch (tipo){
  case 'diagnostico': {
    const evs = lista('evaluaciones').filter(x => enAnio(x.fecha));
    const concep = {}; evs.forEach(x => concep[x.concepto] = (concep[x.concepto] || 0) + 1);
    const conEval = act.filter(t => evalsDe(t.id).length).length;
    const tam = lista('tamizajes').filter(x => enAnio(x.fecha)); const niv = { bajo:0, medio:0, alto:0 }; tam.forEach(x => niv[x.nivel]++);
    const casos = lista('casos').filter(c => c.estado !== 'Cerrado');
    const porProg = Object.keys(PROGRAMAS).map(p => [PROGRAMAS[p], casos.filter(c => c.programa === p).length]).filter(x => x[1]).sort((a,b) => b[1] - a[1]);
    const dx = {}; lista('hc').forEach(h => String(h.diagnosticos || '').split(/[;,\n]/).map(s => s.trim()).filter(Boolean).forEach(d => dx[d] = (dx[d] || 0) + 1));
    const topDx = Object.entries(dx).sort((a,b) => b[1] - a[1]).slice(0, 10);
    return [...socio().slice(0, 3),
      ['Evaluaciones médicas ocupacionales', `${conEval} de ${n} trabajadores (${pct(conEval, n)} %) tienen al menos una evaluación. En ${y} se registraron ${evs.length}: ${Object.entries(concep).map(([k, v]) => k.toLowerCase() + ' ' + v).join(', ') || 'ninguna'}.`],
      ['Diagnósticos más frecuentes', topDx.length ? lineas(topDx.map(([k, v]) => `${k}: ${v}`)) : 'Sin diagnósticos registrados en las evaluaciones.'],
      ['Tamizajes', `${tam.length} tamizajes en ${y}: ${niv.bajo} de riesgo bajo, ${niv.medio} de riesgo medio y ${niv.alto} de riesgo alto.`],
      ['Vigilancia epidemiológica', `${casos.length} casos activos.${porProg.length ? ' Por programa: ' + porProg.map(([k, v]) => k.toLowerCase() + ' ' + v).join(', ') + '.' : ''}`],
      ['Accidentalidad y ausentismo', `${atL.length} accidentes de trabajo y ${diasInc} días de incapacidad registrados en ${y}.`],
      ['Cumplimiento de recomendaciones', `${cum} de ${tar.length} tareas cumplidas (${pct(cum, tar.length)} %). ${venc} vencidas.`],
      ['Recomendaciones para los programas de vigilancia', 'Escriba aquí las recomendaciones del médico, priorizadas por riesgo.']];
  }
  case 'pve': {
    const p = P.programa; const cs = lista('casos').filter(c => c.programa === p);
    const act2 = cs.filter(c => c.estado !== 'Cerrado'), nuevos = cs.filter(c => enAnio(c.abierto)), cerr = cs.filter(c => c.estado === 'Cerrado' && enAnio(c.cerrado));
    const tam = lista('tamizajes').filter(x => INSTR[x.instrumento]?.prog === p && enAnio(x.fecha)); const niv = { bajo:0, medio:0, alto:0 }; tam.forEach(x => niv[x.nivel]++);

async function pdfInforme(id){

  y += 8;

    salto(30); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,58,76); doc.text(t, M, y); y += 15;
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(27,37,48);
    doc.splitTextToSize(txt, W - 2 * M).forEach(l => { salto(14); doc.text(l, M, y); y += 13.5; }); y += 8;
  });
  salto(50); y += 10; doc.setLineWidth(.8); doc.line(M, y, W - M, y); y += 15; doc.setFontSize(9.5);

  await descargar(i.titulo + '.pdf', marcaPDF(doc).output('blob'));
}

async function procesarLogo(file){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast('El logo pesa más de 5 MB. Use una imagen más liviana.');
  const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(file); });
  const im = await cargarImg(url);
  const esc2 = Math.min(1, 360 / Math.max(im.width, im.height));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(im.width * esc2)); cv.height = Math.max(1, Math.round(im.height * esc2));
  const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, cv.width, cv.height);
  let out = cv.toDataURL('image/png');
  if (out.length > 150000){ const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height; const x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, c2.width, c2.height); x2.drawImage(cv, 0, 0); out = c2.toDataURL('image/jpeg', .85); }
  dlgEmpresa.logo = out; const p = $('#em-lgp'); if (p) p.innerHTML = `<img src="${out}" alt="Logo">`;
}

function calAuto(key, y){
  const Y = String(y); const inf = t => lista('informes').find(i => i.tipo === t && i.firma && String(i.periodo || i.titulo).includes(Y));
  const acta = (c, m1, m2) => lista('actas').find(a => a.comite === c && a.fecha >= m1 && a.fecha <= m2);
  const k = key.split('@')[0], per = key.split('@')[1];
  if (per){ const m = Number(per); const ini = Y + '-' + String(m).padStart(2,'0') + '-01';
    if (k === 'copasst'){ const a = acta('copasst', ini, finMes(y, m)); return a ? 'Acta del ' + fmt(a.fecha) : null; }
    if (k === 'convivencia'){ const ini3 = Y + '-' + String(m - 2).padStart(2,'0') + '-01'; const a = acta('convivencia', ini3, finMes(y, m)); return a ? 'Acta del ' + fmt(a.fecha) : null; }
    return null; }
  const map = { plan:'plananual', diag:'diagnostico', auditoria:'auditoria', revision:'revision', rendicion:'rendicion' };
  if (map[k]){ const i = inf(map[k]); return i ? 'Informe firmado: ' + i.titulo : null; }
  if (k === 'simulacro'){ const c = lista('simulacros').find(s => enAnioF(s.fecha, y)) || lista('capacitaciones').find(c => c.tipo === 'Simulacro' && enAnioF(c.fecha, y)); return c ? 'Simulacro del ' + fmt(c.fecha) : null; }
  if (k === 'psico'){ const b = lista('bateria').find(b => b.publicado && enAnioF(b.fecha, y)); return b ? 'Batería aplicada el ' + fmt(b.fecha) : null; }
  if (k === 'matriz'){ const p = lista('peligros').filter(p => enAnioF(p.revisado, y)); return p.length ? p.length + ' peligros valorados en ' + y : null; }

const GTC_ACEP = { I:['No aceptable','p-bad'], II:['No aceptable o aceptable con control específico','p-warn'], III:['Mejorable','p-amb'], IV:['Aceptable','p-ok'] };
const PEL_EJ = { 'Biológico':'Virus, bacterias, hongos, picaduras, mordeduras, fluidos', 'Físico':'Ruido, iluminación, vibración, temperaturas extremas, radiaciones', 'Químico':'Polvos, gases, vapores, humos, líquidos, nieblas', 'Psicosocial':'Carga de trabajo, jornada, relaciones, atención al público', 'Biomecánico':'Postura, movimiento repetitivo, esfuerzo, manipulación de cargas', 'Condiciones de seguridad':'Mecánico, eléctrico, locativo, tecnológico, accidentes de tránsito, públicos, trabajo en alturas', 'Fenómenos naturales':'Sismo, inundación, vendaval, tormenta eléctrica' };

/* ---------- inspecciones y entrega de EPP ---------- */
const INSP = {
  extintores:{ n:'Extintores', cada:1, items:['Ubicado en el lugar asignado y señalizado','Acceso libre, sin obstáculos','Manómetro en zona verde','Sello y pasador de seguridad en su lugar','Manguera y boquilla en buen estado','Etiqueta con fecha de recarga vigente','Cilindro sin golpes, corrosión ni fugas'] },
  botiquin:{ n:'Botiquín y primeros auxilios', cada:1, items:['Botiquín ubicado y señalizado','Elementos completos según el listado','Elementos dentro de la fecha de vencimiento','Camilla y inmovilizadores disponibles','Personal entrenado en primeros auxilios en el turno'] },
  locativa:{ n:'Locativa, orden y aseo', cada:3, items:['Pisos sin obstáculos, huecos ni superficies resbalosas','Escaleras con pasamanos y antideslizante','Iluminación adecuada','Ventilación adecuada','Almacenamiento estable y a altura segura','Puestos de trabajo ordenados y limpios','Baños y zonas comunes en buen estado'] },
  epp:{ n:'Uso de EPP', cada:3, items:['Los trabajadores usan el EPP requerido para su cargo','El EPP está en buen estado','Hay registro de entrega firmado','Hay EPP de reposición disponible','Los trabajadores saben usar y cuidar su EPP'] },
  herramientas:{ n:'Herramientas y equipos', cada:3, items:['Herramientas en buen estado, sin improvisaciones','Guardas y protecciones de máquinas en su lugar','Equipos con mantenimiento al día','Cables y extensiones sin empalmes ni daños','Bloqueo y etiquetado disponible para mantenimiento'] },
  vehiculos:{ n:'Vehículos (verificación del preoperacional)', cada:1, items:['Inspección preoperacional diaria diligenciada','Llantas, luces, frenos y pito en buen estado','Documentos del vehículo vigentes','Kit de carretera y extintor','Cinturones de seguridad funcionando'] },
  emergencias:{ n:'Señalización y rutas de evacuación', cada:6, items:['Rutas de evacuación señalizadas y libres','Salidas de emergencia sin bloquear','Punto de encuentro señalizado','Alarma de emergencia funcionando','Plano de evacuación visible','Iluminación de emergencia funcionando'] },
  electrica:{ n:'Instalaciones eléctricas', cada:6, items:['Tableros cerrados, señalizados y con acceso libre','Tomas e interruptores sin daños','Sin cables expuestos ni sobrecarga de tomas','Polo a tierra en equipos que lo requieren'] }
};
function progInspecciones(){
  const ins = lista('inspecciones');
  return Object.entries(INSP).map(([k, t]) => { const u = ins.filter(i => i.tipo === k).sort((a,b) => b.fecha.localeCompare(a.fecha))[0]; return { k, n:t.n, cada:t.cada, ultima:u?.fecha || null, proxima:u ? addM(u.fecha, t.cada) : null }; });
}
function eppVencidos(){
  const ult = {}; lista('epp').forEach(x => { if (!ult[x.trabajador] || x.fecha > ult[x.trabajador].fecha) ult[x.trabajador] = x; });
  return Object.values(ult).filter(x => x.reposicion && x.reposicion < HOY && tById(x.trabajador)?.estado !== 'retirado');
}
VIEWS.inspecciones = () => {
  const tab = UI.f.inspTab || 'insp'; const ed = edGes();
  let cuerpo = '';
  if (tab === 'insp'){
    const ins = lista('inspecciones').sort((a,b) => b.fecha.localeCompare(a.fecha)); const pr = progInspecciones();
    cuerpo = `<div class="head" style="margin-bottom:10px"><p class="lead" style="margin:0">Cada ítem que no cumple se vuelve una acción correctiva.</p>${ed ? '<button class="btn pri" type="button" data-act="inspeccion">+ Inspección</button>' : ''}</div>
    <section class="box" style="margin-bottom:14px"><h3>Programa de inspecciones</h3><div class="tw" style="margin-top:8px"><table class="t"><thead><tr><th>Inspección</th><th>Frecuencia sugerida</th><th>Última</th><th>Próxima</th></tr></thead><tbody>
    ${pr.map(p => `<tr><td class="nm">${esc(p.n)}</td><td>${p.cada === 1 ? 'Mensual' : 'Cada ' + p.cada + ' meses'}</td><td class="num">${fmt(p.ultima)}</td><td>${p.proxima ? pill(fmt(p.proxima), diasA(p.proxima) < 0 ? 'p-bad' : diasA(p.proxima) <= 15 ? 'p-warn' : 'p-ok') : pill('Sin realizar', 'p-warn')}</td></tr>`).join('')}</tbody></table></div></section>
    <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Inspección</th><th>Lugar</th><th>Responsable</th><th>Cumplimiento</th><th>Hallazgos</th><th></th></tr></thead><tbody>
    ${ins.map(i => { const nC = (i.items || []).filter(x => x.r === 'n').length, c = (i.items || []).filter(x => x.r === 'c').length; const p = pct(c, c + nC);
      return `<tr><td class="num">${fmt(i.fecha)}</td><td class="nm">${esc(INSP[i.tipo]?.n || i.tipo)}</td><td>${esc(i.lugar)}</td><td>${esc(i.responsable)}</td><td>${pill(p + ' %', p >= 90 ? 'p-ok' : p >= 70 ? 'p-warn' : 'p-bad')}</td><td class="small" style="max-width:280px">${(i.items || []).filter(x => x.r === 'n').map(x => esc(x.t) + (x.o ? ' (' + esc(x.o) + ')' : '')).join('; ') || 'Sin hallazgos'}</td><td>${ed ? `<button class="btn gh sm" type="button" data-act="inspeccion" data-id="${i.id}">Abrir</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">Sin inspecciones registradas.</td></tr>'}
    </tbody></table></div>
    <p class="norma"><b>Normas:</b> Decreto 1072 de 2015, arts. 2.2.4.6.12 (num. 12, registros de inspecciones) y 2.2.4.6.24 (mantenimiento de instalaciones, equipos y herramientas) · Resolución 0312 de 2019, estándares 4.2.4 y 4.2.5.</p>`;
  } else {
    const es = lista('epp').sort((a,b) => b.fecha.localeCompare(a.fecha)); const venc = eppVencidos();
    const conEpp = new Set(lista('epp').map(x => x.trabajador));
    const sin = activos().filter(t => { const e = C.d.cargos?.[t.cargo]?.epp; return e && !/no requiere/i.test(e) && !conEpp.has(t.id); });
    cuerpo = `<div class="head" style="margin-bottom:10px"><p class="lead" style="margin:0">${sin.length ? `<b>${sin.length}</b> trabajadores cuyo cargo requiere EPP no tienen entrega registrada. ` : ''}${venc.length ? `<b>${venc.length}</b> con reposición vencida.` : 'Ninguna reposición vencida.'}</p>${ed ? '<button class="btn pri" type="button" data-act="eppEntrega">+ Entrega de EPP</button>' : ''}</div>
    ${sin.length ? `<p class="small" style="margin:0 0 10px">Sin entrega: ${sin.slice(0, 15).map(t => esc(nombreT(t)) + ' (' + esc(cargoN(t.cargo)) + ')').join(', ')}${sin.length > 15 ? '…' : ''}</p>` : ''}
    <div class="tw"><table class="t"><thead><tr><th>Fecha</th><th>Trabajador</th><th>Elementos entregados</th><th>Reposición</th><th>Recibido</th><th></th></tr></thead><tbody>
    ${es.map(x => `<tr><td class="num">${fmt(x.fecha)}</td><td class="nm">${esc(nombreT(tById(x.trabajador)))}<span class="sub">${esc(cargoN(tById(x.trabajador)?.cargo))}</span></td><td style="max-width:320px">${esc(x.elementos)}</td><td>${x.reposicion ? pill(fmt(x.reposicion), diasA(x.reposicion) < 0 ? 'p-bad' : diasA(x.reposicion) <= 15 ? 'p-warn' : 'p-ok') : '—'}</td><td>${x.firmado ? pill('Firmado', 'p-ok') : pill('Sin firma', 'p-warn')}${x.capacitado ? '<span class="sub">Capacitado en uso</span>' : ''}</td><td>${ed ? `<button class="btn gh sm" type="button" data-act="eppEntrega" data-id="${x.id}">Editar</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Sin entregas registradas.</td></tr>'}
    </tbody></table></div>
    <p class="norma"><b>Normas:</b> Decreto 1072 de 2015, art. 2.2.4.6.24, parágrafo 1 (suministro de EPP sin costo y capacitación en su uso) · Resolución 2400 de 1979, título IV · Resolución 0312 de 2019, estándar 4.2.6.</p>`;
  }
  return `${head('Inspecciones y entrega de EPP', 'Inspecciones planeadas con lista de chequeo y control de los elementos de protección personal entregados a cada trabajador.', '')}
  <nav class="tabs2" style="max-width:480px;margin:0 0 14px" aria-label="Sección"><button type="button" data-act="inspTab" data-v="insp" aria-pressed="${tab === 'insp'}">Inspecciones</button><button type="button" data-act="inspTab" data-v="epp" aria-pressed="${tab === 'epp'}">Entrega de EPP</button></nav>${cuerpo}`;
};

function datosGerencia(y){
  const cal = calificacion(y), band = bandaEstandares(cal.p), al = alertas();
  const venc = al.filter(a => diasA(a.vence) < 0).length;
  const ats = lista('accidentes').filter(a => enAnioF(a.fecha, y)), atL = ats.filter(a => a.tipo !== 'Incidente');
  const graves = atL.filter(a => a.tipo === 'Accidente grave' || a.tipo === 'Accidente mortal');
  const diasAT = atL.reduce((s, a) => s + Number(a.dias || 0) + Number(a.cargados || 0), 0);
  const inc = lista('incapacidades').filter(x => enAnioF(x.desde, y)); const diasInc = inc.reduce((s, x) => s + Number(x.dias || 0), 0);
  const acpm = lista('acpm'), acAb = acpm.filter(a => a.estado !== 'cerrada'), acV = acAb.filter(a => diasA(a.vence) < 0);
  const ci = calItems(y), ciHasta = ci.filter(i => i.vence <= HOY || i.hecho), ciOk = ciHasta.filter(i => i.hecho).length;
  const pel = lista('peligros').map(gtc), noAcep = pel.filter(g => g.nivel === 'I' || g.nivel === 'II').length;
  const rep = lista('reportes'), repN = rep.filter(r => r.estado === 'nuevo').length;
  const sal = Number(emp()?.salarioPromedio || 0), costo = sal ? diasInc * sal / 30 : 0;
  const ins = lista('inspecciones').filter(i => enAnioF(i.fecha, y)).length, caps = lista('capacitaciones').filter(c => enAnioF(c.fecha, y)).length;
  const motivos = [];
  if (cal.evaluados && cal.p < 60) motivos.push(['r', `Estándares mínimos en ${cal.p} % (valoración crítica).`]);
  else if (cal.evaluados && cal.p <= 85) motivos.push(['a', `Estándares mínimos en ${cal.p} % (moderadamente aceptable).`]);
  else if (!cal.evaluados) motivos.push(['a', 'Aún no se ha hecho la autoevaluación de estándares mínimos.']);
  if (graves.some(a => a.tipo === 'Accidente mortal')) motivos.push(['r', 'Hubo un accidente mortal en el año.']);
  else if (graves.length) motivos.push(['r', `${graves.length} accidente${graves.length > 1 ? 's' : ''} grave${graves.length > 1 ? 's' : ''} en el año.`]);
  if (venc > 5) motivos.push(['r', `${venc} obligaciones o pendientes vencidos.`]); else if (venc) motivos.push(['a', `${venc} pendiente${venc > 1 ? 's' : ''} vencido${venc > 1 ? 's' : ''}.`]);
  if (acV.length) motivos.push(['a', (acV.length > 1 ? `${acV.length} acciones de mejora vencidas.` : '1 acción de mejora vencida.')]);
  if (noAcep) motivos.push(['a', (noAcep > 1 ? `${noAcep} riesgos no aceptables en la matriz de peligros.` : '1 riesgo no aceptable en la matriz de peligros.')]);
  if (ciHasta.length && pct(ciOk, ciHasta.length) < 70) motivos.push(['a', `Calendario legal cumplido al ${pct(ciOk, ciHasta.length)} %.`]);
  const sem = motivos.some(m => m[0] === 'r') ? 'r' : motivos.length ? 'a' : 'v';
  return { cal, band, venc, atL, ats, graves, diasAT, diasInc, acAb, acV, ciHasta, ciOk, noAcep, repN, sal, costo, ins, caps, motivos, sem };
}

/* ---------- PDF genérico ---------- */
async function pdfSimple(nombre, titulo, sub, secciones, pie){
  if (!window.jspdf) return toast('No cargó el generador de PDF.');
  const e = emp(); const doc = new window.jspdf.jsPDF({ unit:'pt', format:'letter' }); const W = 612, M = 54; let y = M;
  if (e.logo){ try { const im = await cargarImg(e.logo); const h = 46, w = Math.min(140, im.width / im.height * h); doc.addImage(e.logo, e.logo.includes('image/png') ? 'PNG' : 'JPEG', W - M - w, y - 6, w, h); } catch(err){} }
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(30,58,76); doc.text(e.razon, M, y + 8);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(86,103,111); doc.text('NIT ' + e.nit + '-' + e.dv + (e.ciudad ? ' · ' + e.ciudad : ''), M, y + 22);
  y += 48; doc.setDrawColor(30,58,76); doc.setLineWidth(1.5); doc.line(M, y, W - M, y); y += 24;
  const salto = h => { if (y + h > 740){ doc.addPage(); y = M; } };
  doc.setTextColor(21,35,43); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.splitTextToSize(titulo, W - 2 * M).forEach(l => { doc.text(l, M, y); y += 16; });
  if (sub){ doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(86,103,111); doc.splitTextToSize(sub, W - 2 * M).forEach(l => { doc.text(l, M, y); y += 12; }); }
  y += 8;
  secciones.forEach(([t, cont]) => {
    salto(34); doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,58,76); doc.text(t, M, y); y += 15; doc.setTextColor(21,35,43);
    if (Array.isArray(cont)){
      cont.forEach(([a, b]) => { doc.setFontSize(9.5); doc.setFont('helvetica','normal'); const la = doc.splitTextToSize(String(a), 170); doc.setFont('helvetica','bold'); const lb = doc.splitTextToSize(String(b ?? '—') || '—', W - 2 * M - 180);
        const h = Math.max(la.length, lb.length) * 12; salto(h + 6); doc.setFont('helvetica','normal'); doc.text(la, M, y); doc.setFont('helvetica','bold'); doc.text(lb, M + 180, y); y += h; doc.setDrawColor(220,227,226); doc.setLineWidth(.5); doc.line(M, y - 6, W - M, y - 6); y += 4; });
      y += 6;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.splitTextToSize(String(cont || '—'), W - 2 * M).forEach(l => { salto(14); doc.text(l, M, y); y += 13.5; }); y += 8;
    }
  });
  if (pie){ salto(40); y += 6; doc.setLineWidth(.8); doc.setDrawColor(30,58,76); doc.line(M, y, W - M, y); y += 14; doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(86,103,111); doc.splitTextToSize(pie, W - 2 * M).forEach(l => { salto(12); doc.text(l, M, y); y += 11; }); }
  await descargar(nombre + '.pdf', marcaPDF(doc).output('blob'));
}

function agregarInd(ind){

function estadoCT(c){
  const d = c.docs || {}; const falta = [];
  DOC_CT.forEach(([k, n, tipo, opc]) => { const x = d[k] || {}; if (opc && !x.aplica) return;
    if (tipo === 'vence' && (!x.vence || x.vence < HOY)) falta.push(n);
    if (tipo === 'mes' && x.mes !== HOY.slice(0, 7)) falta.push('PILA de ' + MESC[Number(HOY.slice(5, 7)) - 1]);
    if (tipo === 'fecha' && !x.fecha) falta.push(n); });
  if (c.fin && c.fin < HOY) return { ok:false, falta, t:'Contrato terminado', cls:'' };
  return falta.length ? { ok:false, falta, t:'No habilitado', cls:'p-bad' } : { ok:true, falta, t:'Habilitado', cls:'p-ok' };
}

  login(form){ return login(form); },

    const u = yo(); if (await hashClave(String(fd.get('actual')), u.sal) !== u.hash) return errForm(form, 'La contraseña actual no es correcta.');

async function setStd(cod, estado, nota){

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav){ UI.vista = nav.dataset.nav; cerrar(); render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACTS[a.dataset.act]){ if (a.tagName === 'TR' && e.target.closest('button')) return; e.preventDefault(); Promise.resolve(ACTS[a.dataset.act](a)).catch(errGuardar); }
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (!fn) return;
  const btn = f.querySelector('[type=submit]'); if (btn?.disabled) return; if (btn) btn.disabled = true;
  try { await fn(f, new FormData(f)); } catch(err){ errGuardar(err); } finally { if (btn && document.contains(btn)) btn.disabled = false; }
});
document.addEventListener('input', e => {
  const q = e.target.dataset?.q; if (q){ UI.q[q] = e.target.value; render(); }
});
document.addEventListener('change', e => {
  const f = e.target.dataset?.f; if (f){ UI.f[f] = /^anio/.test(f) ? Number(e.target.value) : e.target.value; render(); return; }

  if (e.target.id === 'gi-t') ajustaGenInf();
  if (e.target.id === 'ap-i'){ $('#ap-form').innerHTML = formTamizaje(e.target.value, 'q'); }
  if (e.target.id === 'em-logo'){ procesarLogo(e.target.files[0]).catch(() => toast('No se pudo leer la imagen.')); }
});

/* =================== arranque =================== */
async function iniciar(){
  try { DBX = await (window.claude?.use ? window.claude.use('db') : null); } catch(e){ DBX = null; }
  try { DL = await (window.claude?.use ? window.claude.use('downloads') : null); } catch(e){ DL = null; }
  MODO = DBX ? 'db' : 'mem';
  if (API.url){
    MODO = 'cargando';
    if (!DL) DL = { save: async ({ filename, data }) => { const a = document.createElement('a'); a.href = URL.createObjectURL(data); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); } };
    try { const j = await API.call('GET', '/api/estado'); API.hay = j.hayUsuarios; } catch(e){ document.body.innerHTML = '<div class="loading">No hay conexión con el servidor de Centinela SST. Si es la primera visita del día, espere un minuto y recargue la página.</div>'; return; }
    if (SES?.token){ API.entrar(SES.token); } else { SES = null; MODO = 'api'; API.listo = true; }
  }
  Data.sub('usuarios', (o, cache) => { G.usuarios = o; if (!cache) G.listo.usuarios = true; pedirRender(); });
  Data.sub('empresas', (o, cache) => { G.empresas = o; if (!cache) G.listo.empresas = true; pedirRender(); });
  Data.sub('soporte', o => { G.soporte = o; pedirRender(); });
  Data.sub('normas', o => { G.normas = o; pedirRender(); });
  Data.sub('plataforma', (o, cache) => { G.plat = o; if (!cache) G.listo.plataforma = true; pedirRender(); });
  if (SES?.trab) entrarEmpresa(SES.trab.cid);
  else if (SES?.uid) setTimeout(() => { const u = yo(); if (u && u.rol !== 'super') entrarEmpresa(u.empresa); pedirRender(); }, 0);
  render();
}
iniciar();
})();
